name: YouClean Android TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youclean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YouClean build configuration
        uses: actions/checkout@v4

      - name: Checkout upstream CleanYourTV source
        run: |
          git clone --depth 1 https://github.com/Gathin23/cleanyourtv.git upstream
          echo "Upstream commit: $(git -C upstream rev-parse HEAD)"

      - name: Add YouClean app manager screen
        run: |
          mkdir -p upstream/launcher/app/src/main/java/com/gathin/tvhome
          cp youclean/YouCleanManagerActivity.java upstream/launcher/app/src/main/java/com/gathin/tvhome/YouCleanManagerActivity.java
          cp youclean/YouCleanAdbGuideActivity.java upstream/launcher/app/src/main/java/com/gathin/tvhome/YouCleanAdbGuideActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/launcher/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n'
          if "android.permission.QUERY_ALL_PACKAGES" not in s:
              s = s.replace('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n',
                            permission + '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n')
          activity = '''
                  <activity
                      android:name=".YouCleanManagerActivity"
                      android:label="YouClean Apps"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
          '''
          if ".YouCleanManagerActivity" not in s:
              s = s.replace('        <activity\n            android:name=".MainActivity"', activity + '\n        <activity\n            android:name=".MainActivity"', 1)
          adb_activity = """
                  <activity
                      android:name=".YouCleanAdbGuideActivity"
                      android:label="YouClean ADB Wi-Fi"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
          """
          if ".YouCleanAdbGuideActivity" not in s:
              s = s.replace('        <activity\n            android:name=".MainActivity"', adb_activity + '\n        <activity\n            android:name=".MainActivity"', 1)
          p.write_text(s)
          assert "YouCleanManagerActivity" in s
          assert "YouCleanAdbGuideActivity" in s
          assert "QUERY_ALL_PACKAGES" in s
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Prepare YouClean branding
        working-directory: upstream/launcher
        run: |
          sed -i 's/<string name="app_name">Home<\/string>/<string name="app_name">YouClean<\/string>/' app/src/main/res/values/strings.xml
          grep -q '<string name="app_name">YouClean</string>' app/src/main/res/values/strings.xml

      - name: Build release APK
        working-directory: upstream/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PlauncherApplicationId=com.youclean.tvhome assembleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/YouClean.apk

      - name: Package complete upstream source and device data
        run: |
          zip -qr dist/YouClean-upstream-source.zip upstream -x "upstream/.git/*"
          sha256sum dist/YouClean.apk dist/YouClean-upstream-source.zip | tee dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouClean-Android-TV
          path: |
            dist/YouClean.apk
            dist/YouClean-upstream-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youclean-build-${{ github.run_number }}
          name: YouClean build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/YouClean.apk
            dist/YouClean-upstream-source.zip
            dist/SHA256SUMS.txt
