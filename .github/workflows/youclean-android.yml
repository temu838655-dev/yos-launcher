name: YouClean Android Phone

on:
  push:
    branches: [feature/adb-wifi-prototype]
    paths-ignore:
      - '.github/workflows/vendor-cleanyourtv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youclean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YouClean build configuration
        uses: actions/checkout@v4

      - name: Verify vendored complete CleanYourTV source
        run: |
          test -f UPSTREAM_COMMIT
          test -f upstream/LICENSE
          test -f upstream/launcher/gradlew
          echo "Building from vendored upstream commit: $(cat UPSTREAM_COMMIT)"

      - name: Add YouClean app manager screen
        run: |
          mkdir -p upstream/launcher/app/src/main/java/com/gathin/tvhome
          cp youclean/YouCleanManagerActivity.java upstream/launcher/app/src/main/java/com/gathin/tvhome/YouCleanManagerActivity.java
          cp youclean/YouCleanAdbGuideActivity.java upstream/launcher/app/src/main/java/com/gathin/tvhome/YouCleanAdbGuideActivity.java
          cp youclean/YouCleanAdbWifiActivity.kt upstream/launcher/app/src/main/java/com/gathin/tvhome/YouCleanAdbWifiActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/launcher/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n'
          if "android.permission.QUERY_ALL_PACKAGES" not in s:
              s = s.replace('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n',
                            permission + '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n')
          activity = '''
                  <activity
                      android:name=".YouCleanManagerActivity"
                      android:label="YouClean Apps"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:screenOrientation="landscape" />
          '''
          if ".YouCleanManagerActivity" not in s:
              s = s.replace('        <activity\n            android:name=".MainActivity"', activity + '\n        <activity\n            android:name=".MainActivity"', 1)
          adb_activity = """
                  <activity
                      android:name=".YouCleanAdbGuideActivity"
                      android:label="YouClean ADB Wi-Fi"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:screenOrientation="landscape" />
          """
          if ".YouCleanAdbGuideActivity" not in s:
              s = s.replace('        <activity\n            android:name=".MainActivity"', adb_activity + '\n        <activity\n            android:name=".MainActivity"', 1)
          p.write_text(s)
          assert "YouCleanManagerActivity" in s
          assert "YouCleanAdbGuideActivity" in s
          adb_wifi_activity = """
                  <activity
                      android:name=".YouCleanAdbWifiActivity"
                      android:label="YouClean ADB Wi-Fi (thử nghiệm)"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:screenOrientation="landscape" />
          """
          if ".YouCleanAdbWifiActivity" not in s:
              s = s.replace('        <activity\n            android:name=".MainActivity"', adb_wifi_activity + '\n        <activity\n            android:name=".MainActivity"', 1)
          if "android.permission.INTERNET" not in s:
              s = s.replace('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n',
                            '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n')
          assert "YouCleanAdbWifiActivity" in s
          assert "android.permission.INTERNET" in s
          assert "QUERY_ALL_PACKAGES" in s

          PY
          python3 youclean/integrate_settings.py

      - name: Enable Kotlin and ADB library for prototype
        working-directory: upstream/launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("build.gradle")
          s = root.read_text()
          if "org.jetbrains.kotlin.android" not in s:
              s = s.replace("plugins {", "plugins {\n    id 'org.jetbrains.kotlin.android' version '2.4.21' apply false", 1)
          root.write_text(s)
          app = Path("app/build.gradle")
          s = app.read_text()
          if "org.jetbrains.kotlin.android" not in s:
              s = s.replace("    id 'com.android.application'", "    id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'", 1)
          if "adb-kt:v1.0.6" not in s:
              s = s.replace("dependencies {", "dependencies {\n    implementation 'com.github.rhythmcache:adb-kt:v1.0.6'", 1)
          if "kotlinx-coroutines-android" not in s:
              s = s.replace("dependencies {", "dependencies {\n    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'", 1)
          duplicate_patterns = [
              "META-INF/versions/9/OSGI-INF/MANIFEST.MF",
              "META-INF/versions/17/OSGI-INF/MANIFEST.MF",
              "META-INF/versions/**/OSGI-INF/MANIFEST.MF",
              "META-INF/LICENSE.md",
              "META-INF/LICENSE*",
              "META-INF/NOTICE*",
          ]
          marker = "'DebugProbesKt.bin'"
          missing = [pattern for pattern in duplicate_patterns if pattern not in s]
          if missing:
              if marker not in s:
                  raise SystemExit("Expected Android packaging excludes marker not found")
              s = s.replace(marker, marker + ", " + ", ".join("'" + pattern + "'" for pattern in missing), 1)
          app.write_text(s)
          settings = Path("settings.gradle")
          s = settings.read_text()
          if "jitpack.io" not in s:
              block_start = s.find("dependencyResolutionManagement")
              repo_start = s.find("repositories {", block_start)
              if block_start < 0 or repo_start < 0:
                  raise SystemExit("dependencyResolutionManagement.repositories block not found")
              insert_at = repo_start + len("repositories {")
              s = s[:insert_at] + chr(10) + "        maven { url 'https://jitpack.io' }" + s[insert_at:]
          settings.write_text(s)
          assert "jitpack.io" in s
          assert "jitpack.io" in s
          PY

      - name: Restore standalone YouClean phone app module
        run: |
          mkdir -p upstream/launcher/phone/src/main/java/com/youclean/phone
          cp youclean/phone/build.gradle upstream/launcher/phone/build.gradle
          cp youclean/phone/AndroidManifest.xml upstream/launcher/phone/src/main/AndroidManifest.xml
          cp youclean/phone/MainActivity.kt upstream/launcher/phone/src/main/java/com/youclean/phone/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream/launcher/settings.gradle")
          s = p.read_text()
          if "include ':phone'" not in s:
              s += "\\ninclude ':phone'\\n"
              p.write_text(s)
          assert "include ':phone'" in p.read_text()
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Prepare YouClean branding
        working-directory: upstream/launcher
        run: |
          sed -i 's/<string name="app_name">Home<\/string>/<string name="app_name">YouClean<\/string>/' app/src/main/res/values/strings.xml
          grep -q '<string name="app_name">YouClean</string>' app/src/main/res/values/strings.xml

      - name: Generate read-only upstream TV model catalog
        run: |
          python3 youclean/generate_model_catalog.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("upstream/launcher/app/src/main/assets/youclean/model_catalog.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["schemaVersion"] == 1
          assert len(data["devices"]) >= 400, len(data["devices"])
          print(f"Validated {len(data['devices'])} reference TV profiles")
          PY

      - name: Build release APK
        working-directory: upstream/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PlauncherApplicationId=com.youclean.tvhome :phone:assembleRelease
          mkdir -p ../../dist
          cp phone/build/outputs/apk/release/phone-release.apk ../../dist/YouClean-Phone.apk

      - name: Package complete upstream source and device data
        run: |
          zip -qr dist/YouClean-upstream-source.zip upstream -x "upstream/.git/*"
          sha256sum dist/YouClean-Phone.apk dist/YouClean-upstream-source.zip | tee dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouClean-Android-Phone
          path: |
            dist/YouClean-Phone.apk
            dist/YouClean-upstream-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: youclean-build-${{ github.run_number }}
          name: YouClean build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/YouClean-Phone.apk
            dist/YouClean-upstream-source.zip
            dist/SHA256SUMS.txt
