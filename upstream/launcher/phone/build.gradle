plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.youclean.phone'
    compileSdk 34
    defaultConfig { applicationId 'com.youclean.phone'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'com.github.rhythmcache:adb-kt:v1.0.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
